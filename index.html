<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casual UI kit — tint preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef5;--surface:#ffffff;--tile:#9cc4e0;--tile-dark:#2b2f45;--text:#1d2433;--muted:#5b6478;--line:#d3dae6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141824;--surface:#1e2433;--tile:#3b5a73;--tile-dark:#0e111a;--text:#eef1f7;--muted:#9aa3b8;--line:#2e3648;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141824;--surface:#1e2433;--tile:#3b5a73;--tile-dark:#0e111a;--text:#eef1f7;--muted:#9aa3b8;--line:#2e3648;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
h1{font-size:1.25rem;font-weight:600;margin:0 auto 0 0}
.picker{display:flex;align-items:center;gap:10px}
input[type=color]{width:52px;height:40px;border:none;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:3px solid var(--line);border-radius:12px}
.hex{font-variant-numeric:tabular-nums;min-width:5.5em;color:var(--muted)}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line);cursor:pointer;padding:0}
.sw:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #4c8dff;outline-offset:2px}
.reset{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:7px 12px;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:12px 20px 40px}
h2{font-size:1rem;font-weight:600;margin:26px 0 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px}
.tile{height:120px;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;position:relative}
.tile.dark{background:var(--tile-dark)}
.tile canvas{max-width:85%;max-height:85%}
.lock{position:absolute;top:6px;right:8px;font-size:.7rem;background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:1px 6px}
.name{font-size:.8rem;color:var(--muted);text-align:center;word-break:break-all}
</style></head><body>
<header><h1>Casual UI kit</h1>
<div class="picker"><input type="color" id="pick" value="#5bc8ff" aria-label="Tint color"><span class="hex" id="hex">#5BC8FF</span></div>
<div class="picker" id="swatches"></div>
<button class="reset" id="reset">Show untinted</button></header>
<main id="main"></main>

const TITLES = {buttons:"Buttons",panels:"Panels",progress:"Progress & counters",controls:"Controls",icons:"Icons",fx:"FX"};
const SW = ["#5bc8ff","#7be36a","#ff8a3d","#ff5c8a","#c77dff","#ffd23f"];
const main = document.getElementById("main"), pick = document.getElementById("pick"), hex = document.getElementById("hex");
const items = [];
for (const cat of Object.keys(TITLES)) {
  const list = A.filter(a => a.c === cat); if (!list.length) continue;
  const h = document.createElement("h2"); h.textContent = TITLES[cat]; main.appendChild(h);
  const g = document.createElement("div"); g.className = "grid"; main.appendChild(g);
  for (const a of list) {
    const card = document.createElement("div"); card.className = "card";
    const tile = document.createElement("div");
    const dark = cat === "icons" || (a.n.startsWith("fx_") && a.n !== "fx_coin");
    tile.className = "tile" + (dark ? " dark" : "");
    const s = 2, cv = document.createElement("canvas");
    cv.width = a.w * s; cv.height = a.h * s;
    const disp = Math.min(1, 130 / Math.max(a.w, a.h)) * (Math.max(a.w,a.h) < 40 ? 2 : 1);
    cv.style.width = a.w * disp + "px"; cv.style.height = a.h * disp + "px";
    tile.appendChild(cv);
    if (!a.t) { const l = document.createElement("span"); l.className = "lock"; l.textContent = "fixed color"; tile.appendChild(l); }
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = a.n;
    card.append(tile, nm); g.appendChild(card);
    const img = new Image(); img.src = a.u;
    items.push({a, cv, img, ready: img.decode()});
  }
}
function draw(color) {
  for (const it of items) {
    const g = it.cv.getContext("2d"), W = it.cv.width, H = it.cv.height;
    g.globalCompositeOperation = "source-over"; g.clearRect(0,0,W,H); g.drawImage(it.img,0,0,W,H);
    if (it.a.t && color) {
      g.globalCompositeOperation = "multiply"; g.fillStyle = color; g.fillRect(0,0,W,H);
      g.globalCompositeOperation = "destination-in"; g.drawImage(it.img,0,0,W,H);
      g.globalCompositeOperation = "source-over";
    }
  }
}
function setColor(c) { pick.value = c; hex.textContent = c.toUpperCase(); draw(c); }
const swBox = document.getElementById("swatches");
for (const c of SW) { const b = document.createElement("button"); b.className = "sw"; b.style.background = c;
  b.setAttribute("aria-label", "Tint " + c); b.onclick = () => setColor(c); swBox.appendChild(b); }
pick.addEventListener("input", e => setColor(e.target.value));
document.getElementById("reset").onclick = () => { hex.textContent = "untinted"; draw(null); };
Promise.all(items.map(i => i.ready)).then(() => setColor(pick.value));
